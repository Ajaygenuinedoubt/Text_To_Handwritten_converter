<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Handwritten Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Indie+Flower&family=Allura&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f4;
            height: 100vh;
            flex-direction: column;
        }

        .container {
            text-align: center;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 80%;
        }

        textarea {
            width: 100%;
            height: 200px;
            font-size: 16px;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: none;
        }

        select, input[type="color"], input[type="number"], input[type="button"] {
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        input[type="button"] {
            background-color: #4caf50;
            color: white;
            cursor: pointer;
        }

        input[type="button"]:hover {
            background-color: #45a049;
        }

        #preview {
            margin-top: 20px;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            width: 100%;
            text-align: left;
        }

        .hidden {
            display: none;
        }

        canvas {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Convert Text to Handwritten Style</h1>
    
    <textarea id="text-input" placeholder="Enter your text here..."></textarea>
    
    <br>
    
    <!-- Font Selection -->
    <label for="font-select">Choose Font:</label>
    <select id="font-select">
        <option value="Patrick Hand">Patrick Hand</option>
        <option value="Indie Flower">Indie Flower</option>
        <option value="Allura">Allura</option>
    </select>
    
    <br>
    
    <!-- Font Size Selection -->
    <label for="font-size">Font Size (px):</label>
    <input type="number" id="font-size" value="16" min="10" max="50">
    
    <br>
    
    <!-- Color Selection -->
    <label for="font-color">Choose Text Color:</label>
    <input type="color" id="font-color" value="#000000">
    
    <br>

    <!-- Line or White Paper Selection -->
    <label for="page-type">Page Type:</label>
    <select id="page-type">
        <option value="white">White Paper</option>
        <option value="lined">Lined Paper</option>
    </select>
    
    <br>
    
    <!-- Convert Button -->
    <input type="button" value="Show Handwritten Preview" onclick="showHandwrittenPreview()">
    
    <br>

    <!-- Preview Section -->
    <div id="preview" class="hidden"></div>
    
    <!-- Download Button -->
    <input type="button" id="download-btn" value="Download as PDF" class="hidden" onclick="convertTextToPDF()">

    <canvas id="pdf-canvas"></canvas>
</div>

<script>
    function showHandwrittenPreview() {
        const text = document.getElementById("text-input").value;
        const font = document.getElementById("font-select").value;
        const fontSize = document.getElementById("font-size").value;
        const fontColor = document.getElementById("font-color").value;
        const pageType = document.getElementById("page-type").value;

        if (text === '') {
            alert("Please enter some text.");
            return;
        }

        const previewDiv = document.getElementById("preview");
        previewDiv.innerHTML = '';  // Clear previous content

        // Set background if lined paper
        if (pageType === "lined") {
            previewDiv.style.backgroundImage = "linear-gradient(to bottom, rgba(0,0,0,0.1) 1px, transparent 1px)";
            previewDiv.style.backgroundSize = "100% 40px";
        } else {
            previewDiv.style.backgroundImage = "none";
        }

        previewDiv.style.color = fontColor;
        previewDiv.style.fontSize = fontSize + "px";
        previewDiv.style.fontFamily = font;

        // Split text into lines and add to preview
        const lines = text.split("\n");
        lines.forEach(line => {
            const p = document.createElement("p");
            p.innerText = line;
            previewDiv.appendChild(p);
        });

        previewDiv.classList.remove("hidden");
        document.getElementById("download-btn").classList.remove("hidden");
    }

    function convertTextToPDF() {
        const text = document.getElementById("text-input").value;
        const font = document.getElementById("font-select").value;
        const fontSize = document.getElementById("font-size").value;
        const fontColor = document.getElementById("font-color").value;
        const pageType = document.getElementById("page-type").value;

        // Set up canvas and context
        const canvas = document.getElementById("pdf-canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = 600;
        canvas.height = 800;

        // Fill the background with white or lined paper
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (pageType === "lined") {
            ctx.strokeStyle = "#D3D3D3";
            for (let i = 40; i < canvas.height; i += 40) {
                ctx.moveTo(20, i);
                ctx.lineTo(canvas.width - 20, i);
                ctx.stroke();
            }
        }

        // Set font and color
        ctx.fillStyle = fontColor;
        ctx.font = `${fontSize}px ${font}`;
        ctx.textBaseline = "top";

        // Split text into lines and draw on canvas
        const lines = text.split("\n");
        let yOffset = 40;
        const lineHeight = parseInt(fontSize) + 10;

        for (let line of lines) {
            ctx.fillText(line, 20, yOffset);
            yOffset += lineHeight;
        }

        // Download PDF
        const link = document.createElement("a");
        link.href = canvas.toDataURL("image/png");
        link.download = "handwritten.pdf";
        link.click();
    }
</script>

</body>
</html>
